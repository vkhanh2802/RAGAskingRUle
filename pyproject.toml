[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "regularag"
version = "0.1.0"
description = "Evidence-aware Vietnamese RAG assistant for UIT regulations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.119,<1",
    "llama-cpp-python>=0.3.36,<0.4",
    "pgvector>=0.5,<1",
    "psycopg[binary]>=3.2,<4",
    "pymupdf>=1.26,<2",
    "pydantic-settings>=2.11,<3",
    "sentence-transformers>=5.7,<6",
    "transformers>=4.57,<5",
    "uvicorn[standard]>=0.38,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/regularag"]

[tool.pytest.ini_options]
addopts = "-q"
markers = ["integration: tests that require PostgreSQL"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
