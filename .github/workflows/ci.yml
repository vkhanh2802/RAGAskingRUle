name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: regularag
          POSTGRES_PASSWORD: regularag
          POSTGRES_DB: regularag
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U regularag -d regularag"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      REGULARAG_DATABASE_URL: postgresql://regularag:regularag@localhost:5432/regularag
      REGULARAG_RUN_DB_TESTS: "1"
      REGULARAG_CI_NO_MODELS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: /tmp/regularag-ci-empty-model-cache
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.15"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install pinned CPU dependencies
        run: python -m pip install --prefer-binary -r requirements.lock
      - name: Lint and dependency checks
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python scripts/check_environment.py
          python -m pip check
      - name: Migrate fresh CI database
        run: python scripts/migrate.py
        env:
          PYTHONPATH: src
      - name: Unit and schema-isolated PostgreSQL tests with model mocks
        run: python -m pytest
      - name: UI contracts
        run: node --test tests/ui/contract.test.mjs

  container-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.15"
      - name: Validate and build container
        run: |
          docker compose config --quiet
          docker compose --profile app build api
      - name: Explicit migration then startup
        run: |
          docker compose up -d --wait db
          docker compose --profile tools run --rm tools python scripts/migrate.py
          docker compose --profile app up -d --wait api
      - name: Model-free packaged UI/API smoke
        run: python scripts/check_container.py --base-url http://127.0.0.1:8001
      - name: Logs on failure
        if: failure()
        run: docker compose --profile app logs --no-color
      - name: Clean up CI containers
        if: always()
        run: docker compose --profile app down --volumes
